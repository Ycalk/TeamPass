name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test_project:
    runs-on: ubuntu-latest
    environment: staging
    env:
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: teampass
      POSTGRES_HOST: localhost
      SECRET_KEY: secret
      SUPER_ADMIN_PASSWORD: password
      SUPER_ADMIN_USERNAME: admin
      S3_ACCESS_KEY: s3access
      S3_SECRET_KEY: s3secret
      S3_BUCKET_NAME: media
      S3_REGION_NAME: us-east-1
      S3_ENDPOINT_URL: http://localhost:9444
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Start infrastructure
        run: docker compose up -d postgres seaweedfs
      
      - name: Start PG Proxy
        run: |
          docker run -d --name pg-proxy \
            -p 5432:5432 \
            --network teampass \
            alpine/socat tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.3.1"

      - name: Install Poetry plugins and dependencies
        run: |
          poetry self add poetry-multiproject-plugin
          poetry self add poetry-polylith-plugin
          poetry self add poetry-plugin-export
          poetry install
      
      - name: Create media bucket in SeaweedFS
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.S3_REGION_NAME }}
        run: |
          aws --endpoint-url http://localhost:8333 s3 mb s3://media

      - name: Run tests with pytest
        run: |
          poetry run pytest

  build_wheels:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.3.1"

      - name: Instal Poetry plugins
        run: |
          poetry self add poetry-multiproject-plugin
          poetry self add poetry-polylith-plugin
          poetry self add poetry-plugin-export
          poetry install

      - name: Create entrypoint project wheel
        working-directory: projects/entrypoint
        run: |
          poetry install
          poetry build-project
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Create migrator project wheel
        working-directory: projects/migrator
        run: |
          poetry install
          poetry build-project
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Create admin panel project wheel
        working-directory: projects/admin_panel
        run: |
          poetry install
          poetry build-project
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Archive code for deploy
        run: |
          zip -r deploy.zip docker-compose.yaml projects/ jaeger/

      - name: Create .env file
        run: |
          echo "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${{ secrets.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env

          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env

          echo "ADMIN_PANEL_SECRET_KEY=${{ secrets.ADMIN_PANEL_SECRET_KEY }}" >> .env
          echo "SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}" >> .env
          echo "SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}" >> .env

          echo "ALLOW_ORIGIN_REGEX=$(echo "${{ vars.ALLOW_ORIGIN_REGEX_BASE64 }}" | base64 -d)" >> .env
          
          echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> .env
          echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> .env
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env
          
      - name: Transfer files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "deploy.zip,.env"
          target: "/home/${{ secrets.SERVER_USER }}/TeamPass/"

  deploy_container:
    runs-on: ubuntu-latest
    environment: staging
    needs: [build_wheels, test_project]
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/TeamPass/
            unzip -o deploy.zip
            sudo docker compose build
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
            rm /home/${{ secrets.SERVER_USER }}/TeamPass/deploy.zip