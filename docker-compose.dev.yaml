services:
  postgres:
    image: postgres:17.9-bookworm
    restart: always
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  seaweedfs:
    image: chrislusf/seaweedfs:4.23_large_disk
    container_name: seaweedfs_s3
    ports:
      - "127.0.0.1:8333:8333" # S3 API 
      - "127.0.0.1:8888:8888" # Filer
      - "127.0.0.1:9333:9333" # Master
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    entrypoint: /bin/sh
    command: >
      -c "
      echo '{\"identities\":[{\"name\":\"admin_user\",\"credentials\":[{\"accessKey\":\"${S3_ACCESS_KEY}\",\"secretKey\":\"${S3_SECRET_KEY}\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' > /tmp/s3.json &&
      /usr/bin/weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      "
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  seaweedfs-data: