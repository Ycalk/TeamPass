services:
  postgres:
    image: postgres:17.9-bookworm
    restart: always
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  seaweedfs:
    image: chrislusf/seaweedfs:4.23_large_disk
    ports:
      - "127.0.0.1:8333:8333" # S3 API 
      - "127.0.0.1:8888:8888" # Filer
      - "127.0.0.1:9333:9333" # Master
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    command: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - ./seaweedfs/template.json:/template.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  seaweedfs-data: