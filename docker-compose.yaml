x-depends_on: &additional_services_healthy
  postgres:
    condition: service_healthy
  jaeger:
    condition: service_started
  seaweedfs:
    condition: service_healthy

services:
  # Additional
  postgres:
    image: postgres:17.9-bookworm
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  seaweedfs:
    image: chrislusf/seaweedfs:4.23_large_disk
    ports:
      - "127.0.0.1:9444:8333" # S3 API 
      - "127.0.0.1:9555:8888" # Filer
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    command: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - ./seaweedfs/template.json:/template.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.14.1
    restart: always
    ports:
      - "127.0.0.1:9333:16686"
    volumes:
      - "./jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json"
      - "./jaeger/config.yml:/etc/jaeger/config.yml"
    command: ["--config", "/etc/jaeger/config.yml"]
    environment:
      - SPANMETRICS_FLUSH_INTERVAL=10s
    depends_on:
      opensearch:
        condition: service_healthy

  # Services
  migrator:
    build:
      context: projects/migrator
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION_NAME=us-east-1
      - S3_ENDPOINT_URL=http://seaweedfs:8333

      - TRACE_EXPORTER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      <<: *additional_services_healthy

  entrypoint:
    build:
      context: projects/entrypoint
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:9111:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      - SECRET_KEY=${SECRET_KEY}
      - ALLOW_ORIGIN_REGEX=${ALLOW_ORIGIN_REGEX}

      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION_NAME=us-east-1
      - S3_ENDPOINT_URL=http://seaweedfs:8333

      - TRACE_EXPORTER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      <<: *additional_services_healthy
      migrator:
        condition: service_started
  
  admin_panel:
    build:
      context: projects/admin_panel
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:9222:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      - SECRET_KEY=${ADMIN_PANEL_SECRET_KEY}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME}

      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION_NAME=us-east-1
      - S3_ENDPOINT_URL=http://seaweedfs:8333

      - TRACE_EXPORTER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      <<: *additional_services_healthy
      migrator:
        condition: service_started

volumes:
  postgres-data:
  opensearch-data:
  seaweedfs-data:

networks:
  default:
    name: teampass